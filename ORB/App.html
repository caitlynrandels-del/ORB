<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ORB Product App</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap');

    :root {
      color-scheme: dark;
      --bg: #061523;
      --panel: rgba(8, 18, 30, 0.92);
      --line: rgba(72, 215, 198, 0.3);
      --accent: #48d7c6;
      --text: #f3faf8;
      --muted: #8eaeb7;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Space Grotesk", "Avenir Next", sans-serif;
      background: radial-gradient(circle at top, #1a4f62 0%, var(--bg) 56%, #05080f 100%);
      color: var(--text);
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      backdrop-filter: blur(8px);
    }

    .brand {
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab {
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.86rem;
      background: rgba(255,255,255,0.06);
      color: var(--text);
      cursor: pointer;
    }

    .tab.active {
      background: rgba(72, 215, 198, 0.2);
      border-color: rgba(72, 215, 198, 0.5);
      color: #d9fff9;
    }

    .status {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .frame-wrap {
      padding: 12px;
      height: calc(100vh - 68px);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #0b121e;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">ORB Product App</div>
    <nav class="tabs">
      <button class="tab active" data-src="AIO.html">AIO</button>
      <button class="tab" data-src="Index.html">World</button>
      <button class="tab" data-src="CreativeStudio.html">Studio</button>
    </nav>
    <div class="status" id="status">Loading...</div>
  </header>

  <main class="frame-wrap">
    <iframe id="view" src="AIO.html" title="ORB App View"></iframe>
  </main>

  <script>
    const view = document.getElementById('view');
    const tabs = Array.from(document.querySelectorAll('.tab'));
    const status = document.getElementById('status');

    function activateTab(button) {
      tabs.forEach(tab => tab.classList.toggle('active', tab === button));
      const src = button.dataset.src;
      view.src = src;
      status.textContent = `Viewing ${button.textContent}`;
    }

    tabs.forEach(button => {
      button.addEventListener('click', () => activateTab(button));
    });

    async function checkApi() {
      try {
        const response = await fetch('http://127.0.0.1:8010/api/health');
        const payload = await response.json();
        if (response.ok && payload.ok) {
          status.textContent = 'Core online';
          return;
        }
      } catch (error) {}
      status.textContent = 'Core offline (UI fallback active)';
    }

    checkApi();
    window.setInterval(checkApi, 5000);
  </script>
</body>
</html>
